name: Verify against external Smallsemi catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smallsemi-crosscheck.yml'
      - 'experiments/match_smallsemi_catalogue.py'
      - 'experiments/green_structural_monoids.py'
      - 'experiments/green_smallsemi_audit.py'
      - 'experiments/check_smallsemi_ids_direct.g'
      - 'tests/test_match_smallsemi_catalogue.py'
      - 'results/minimal_monoids_order6.json'
      - 'results/smallsemi_catalogue_mapping_2026-11-23.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck-external-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate internal matching algorithm
        run: python3 -m unittest discover -s tests -p 'test_match_smallsemi_catalogue.py' -v
      - name: Compare full independently exported Smallsemi 0.7.2 catalogue
        run: |
          python3 experiments/match_smallsemi_catalogue.py \
            --download \
            --output /tmp/smallsemi_matches.json
          python3 -m json.tool /tmp/smallsemi_matches.json > /dev/null
      - name: Verify Green-J structural theorem over every order-six catalogue monoid
        run: |
          python3 experiments/green_smallsemi_audit.py --download \
            --output /tmp/green-catalogue-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/green-catalogue-audit.json').read_text())
          assert x["general_Green_characterization_matched_every_monoid"]
          assert x["maximal_singleton_obstruction_matched_every_monoid"]
          assert x["maximal_J_two_element_action_criterion_matched_every_case"]
          assert x["two_nonunit_criterion_matched_every_case"]
          assert sorted(x["E_empty_nongroup_smallsemi_ids"]) == [
              3170, 4333, 9407, 9504, 15903, 15957, 15958
          ]
          print("PASS: complete Green-J structural audit against Smallsemi.")
          PY
      - name: Present exact IDs and cross-validation summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path('/tmp/smallsemi_matches.json').read_text())
          lines=['# T28: External Smallsemi 0.7.2 cross-check',
                 '',
                 'Catalogue SHA256: '+p['catalogue_source']['sha256'],
                 'Smallsemi IDs: '+str(p['smallsemi_ids_sorted']),
                 'External anti-isomorphism classes: '+str(p['catalogue_classes_selected']),
                 'Local isomorphism classes: '+str(p['local_isomorphism_classes_matched']),
                 '',
                 '| Local class | Unit group | Action | Smallsemi ID | Orientation |',
                 '|---|---|---|---|---|']
          for x in p['matches']:
              lines.append(
                  f"| {x['local_class']} | {x['unit_group']} | {x['unit_action']} | "
                  f"{x['smallsemi_id']} | {x['orientation']} |"
              )
          summary='\n'.join(lines)+'\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(summary)
          PY
      - name: Verify recorded identifiers and all ten orientations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/smallsemi_matches.json').read_text())
          expected=json.loads(Path('results/smallsemi_catalogue_mapping_2026-11-23.json').read_text())
          assert actual['smallsemi_ids_sorted'] == expected['selected_catalogue_ids']
          assert actual['catalogue_source']['sha256'] == expected['catalogue']['verified_sha256']
          for found, saved in zip(actual['matches'], expected['matches'], strict=True):
              for key in ('local_class', 'unit_group', 'unit_action', 'smallsemi_id', 'orientation'):
                  assert found[key] == saved[key], (key, found, saved)
          assert actual['catalogue_classes_selected'] == 7
          assert actual['local_isomorphism_classes_matched'] == 10
          print('PASS: exact IDs and orientation labels match the committed JSON ledger.')
          PY


  direct-gap-smallsemi:
    name: Verify IdSmallSemigroup against the installed 0.7.2 package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gap-core
      - name: Install exact Smallsemi 0.7.2 source and library
        run: |
          mkdir -p "$HOME/.gap/pkg"
          git clone --depth 1 --branch v0.7.2 \
            https://github.com/gap-packages/smallsemi.git \
            "$HOME/.gap/pkg/smallsemi"
          test "$(git -C "$HOME/.gap/pkg/smallsemi" rev-parse HEAD)" = \
            "22784de79fc9a182d600781e60c7cb5d8f06ebfc"
      - name: Verify all ten IDs from GAP itself
        run: gap -q -b < experiments/check_smallsemi_ids_direct.g
