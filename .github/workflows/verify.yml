name: Verify mathematical experiments

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  finite-binary-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reproducibility tests
        run: python3 -m unittest discover -s tests -v
      - name: Recompute Study 25 periodic Clifford certificates (Node.js)
        run: |
          node experiments/periodic_clifford_depth.js > /tmp/periodic-clifford-recomputed.json
          diff -u results/periodic_clifford_study25.json /tmp/periodic-clifford-recomputed.json
      - name: Recompute Study 39 distributed recovery (Node.js)
        run: |
          node experiments/rees_distributed_recovery.js > /tmp/rees-distributed.json
          diff -u results/rees_distributed_recovery_study39.json /tmp/rees-distributed.json
      - name: Recompute Study 38 source-support obstruction (Node.js)
        run: |
          node experiments/rees_source_support_obstruction.js > /tmp/rees-source-support.json
          diff -u results/rees_source_support_obstruction_study38.json /tmp/rees-source-support.json
      - name: Recompute Study 37 flexible cardinal stars (Node.js)
        run: |
          node experiments/rees_star_flexibility.js > /tmp/rees-star-flexibility.json
          diff -u results/rees_star_flexibility_study37.json /tmp/rees-star-flexibility.json
      - name: Recompute Study 36 relative structural irredundance (Node.js)
        run: |
          node experiments/rees_relative_sources.js > /tmp/rees-relative-recomputed.json
          diff -u results/rees_relative_sources_study36.json /tmp/rees-relative-recomputed.json
      - name: Recompute Study 35 transition cycles and cardinal core (Node.js)
        run: |
          node experiments/rees_transition_cardinal.js > /tmp/rees-transition-recomputed.json
          diff -u results/rees_transition_cardinal_study35.json /tmp/rees-transition-recomputed.json
      - name: Recompute Study 34 finite local support (Node.js)
        run: |
          node experiments/rees_finite_local_support.js > /tmp/rees-support-recomputed.json
          diff -u results/rees_finite_local_support_study34.json /tmp/rees-support-recomputed.json
      - name: Recompute Study 33 robust core and dependency decomposition (Node.js)
        run: |
          node experiments/rees_robust_core.js > /tmp/rees-robust-recomputed.json
          diff -u results/rees_robust_core_study33.json /tmp/rees-robust-recomputed.json
      - name: Recompute Study 32 quotient kernel (Node.js)
        run: |
          node experiments/rees_quotient_kernel.js > /tmp/rees-quotient-recomputed.json
          diff -u results/rees_quotient_kernel_study32.json /tmp/rees-quotient-recomputed.json
      - name: Recompute Study 31 collective coordinate replacement (Node.js)
        run: |
          node experiments/rees_collective_coordinates.js > /tmp/rees-collective-recomputed.json
          diff -u results/rees_collective_coordinates_study31.json /tmp/rees-collective-recomputed.json
      - name: Recompute Study 30 periodic control (Node.js)
        run: |
          node experiments/rees_periodic_control.js > /tmp/rees-periodic-recomputed.json
          diff -u results/rees_periodic_control_study30.json /tmp/rees-periodic-recomputed.json
      - name: Recompute Study 29 anchor core and rectangular rewiring (Node.js)
        run: |
          node experiments/rees_anchor_core.js > /tmp/rees-anchor-recomputed.json
          diff -u results/rees_anchor_core_study29.json /tmp/rees-anchor-recomputed.json
      - name: Recompute Study 28 Rees certificates (Node.js)
        run: |
          node experiments/rees_infinite_depth.js > /tmp/rees-infinite-recomputed.json
          diff -u results/rees_infinite_depth_study28.json /tmp/rees-infinite-recomputed.json
      - name: Recompute Study 27 local class repair certificates (Node.js)
        run: |
          node experiments/local_class_repair.js > /tmp/local-class-repair-recomputed.json
          diff -u results/local_class_repair_study27.json /tmp/local-class-repair-recomputed.json
      - name: Recompute finite-system statistics
        run: python3 experiments/finite_binary_systems.py --max-size 4 --output /tmp/finite-recomputed.json
      - name: Check first checked-in result
        run: diff -u results/finite_binary_systems_n1_to_n4.json /tmp/finite-recomputed.json
      - name: Recompute residues mod 2 through 100
        run: python3 experiments/multiplication_mod_n.py --max-modulus 100 --output /tmp/residue-recomputed.json
      - name: Check residue result
        run: diff -u results/residue_multiplication_n2_to_n100.json /tmp/residue-recomputed.json
      - name: Recompute order-1-through-4 monoids and structural witnesses
        run: python3 experiments/finite_monoids.py --max-size 4 --output /tmp/recomputed-monoids.json
      - name: Compare monoid report to committed results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/monoids_n1_to_n4.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/recomputed-monoids.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Recomputed monoid census differs from committed results'
          print('Monoid report matches committed data.')
          PY
      - name: Recompute multi-operation exact counts
        run: python3 experiments/multiple_operations.py --max-size 4 --max-operations 3 --output /tmp/multi-recomputed.json
      - name: Compare multi-operation results to committed data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/multiple_binary_operations_n1_to_n4_m1_to_m3.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/multi-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Multi-operation count table differs from committed results'
          print('Multi-operation theorem counts match checked-in data.')
          PY
      - name: Recompute the dynamic-system and control-guard cases
        run: python3 experiments/dynamic_systems.py --output /tmp/dynamic-recomputed.json
      - name: Compare dynamic-system report with committed data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/dynamic_systems.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/dynamic-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Dynamic-system cases differ from checked-in report'
          print('Dynamic systems and target-dependent guards match checked-in report.')
          PY
      - name: Recompute inhibited-reaction census (152 rules, both semantics)
        run: python3 experiments/inhibited_reactions.py --output /tmp/inhibited-recomputed.json
      - name: Validate study-six reproducibility
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/inhibited_reactions.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/inhibited-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Inhibited reaction census or witness traces differ'
          print('Inhibitor, consumption and 152-rule census match the recorded data.')
          PY
      - name: Recompute study-seven multiset and conservation results
        run: python3 experiments/multiset_production.py --output /tmp/multiset-recomputed.json
      - name: Check study-seven results and witness traces
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/multiset_production.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/multiset-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Multiset results or witness traces do not match the code'
          print('Multiset coefficient census, type-emergence tests, and conservation traces verified.')
          PY
      - name: Recompute individual-token identity and count projection
        run: python3 experiments/token_identity.py --output /tmp/token-identity-recomputed.json
      - name: Validate individual-token model and saved result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/token_identity.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/token-identity-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Token identity counts or witness traces differ'
          print('Identity policies, type emergence and count projection verified.')
          PY

      - name: Classify the ten order-six minimal monoids from first principles
        run: python3 experiments/classify_minimal_monoids.py --output /tmp/minimal-six-recomputed.json
      - name: Compare all canonical multiplication tables to checked-in class census
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/minimal_monoids_order6.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/minimal-six-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Six-element monoid classification differs from its archive'
          assert actual['total_isomorphism_classes'] == 10
          assert actual['total_anti_isomorphism_classes'] == 7
          print('Complete group-action/ideal census reproduces ten distinct monoids.')
          PY

      - name: Recheck general Green-J finite-monoid structural theorem
        run: |
          python3 experiments/green_structural_monoids.py \
            --output /tmp/green-structural-monoids.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/green-structural-monoids.json').read_text())
          assert d['original_E_definition_unchanged']
          assert [r['enumerated_monoids'] for r in d['small_monoids_exhaustive']] == [1,2,11,156]
          assert len(d['minimal_six_class_examples']) == 10
          assert len(d['theorems']) == 6
          print('PASS: T29–T34, all 170 labelled monoids up to n=4, and 10 minimal examples.')
          PY

      - name: Reproduce study-ten Rees sandwich obstruction and support enumerations
        run: |
          python3 experiments/rees_principal_factors.py --output /tmp/rees-study10.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/rees-study10.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('results/rees_support_study10.json').read_text(encoding='utf-8'))
          assert actual['example_A']['E'] == expected['counterexample']['system_A_E']
          assert actual['example_B']['E'] == expected['counterexample']['system_B_E']
          assert actual['example_A']['green']['idempotent_count'] == expected['counterexample']['same_idempotent_count']
          assert actual['example_B']['green']['idempotent_count'] == expected['counterexample']['same_idempotent_count']
          g1=actual['example_A']['green']
          g2=actual['example_B']['green']
          for field in ('R','L','H','J','J_preorder','regular_elements','idempotent_count',
                        'external_unit_actions_on_nonunits'):
              assert g1[field]==g2[field], field
          by_dimensions={(c['matrix_rows'],c['matrix_columns'],c['local_group_order']):c
                        for c in actual['regular_support_census']}
          for item in expected['rees_support_census']:
              actual_row=by_dimensions[(item['rows'],item['columns'],item['local_group_order'])]
              assert actual_row['regular_supports_checked']==item['regular_supports']
              assert actual_row['E_count_distribution']==item['E_count_distribution']
              assert actual_row['all_predictions_matched']
          print('PASS: Green-invariant counterexample and all Rees support predictions.')
          PY

      - name: Recompute the exact Clifford linking-map theorem and 176 finite models
        run: |
          python3 experiments/clifford_linking_maps.py --output /tmp/clifford-study11.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          observed=json.loads(Path('/tmp/clifford-study11.json').read_text(encoding='utf-8'))
          saved=json.loads(Path('results/clifford_linking_maps_study11.json').read_text(encoding='utf-8'))
          pair=observed['pair_of_nine_element_monoids']
          assert pair['identical_principal_factors_Green_order_idempotent_positions_unit_action']
          a,b=pair['A_trivial_middle_to_bottom'],pair['B_surjective_middle_to_bottom']
          for label,model in (('A',a),('B',b)):
              wanted=saved['examples'][label]
              assert model['E']==wanted['E']
              assert model['idempotents']==wanted['idempotents']
              assert model['table']==wanted['table']
              assert model['orders']==wanted['orders']
          assert observed['diamond_meet_example']['E']==saved['diamond']['E']
          for row in observed['exhaustive_chain_models']:
              k='two_layers' if row['chain_layers']==2 else 'three_layers'
              exp=saved['exhaustive_cyclic_chain'][k]
              assert row['valid_linking_systems_tested']==exp['systems']
              assert row['systems_with_E_empty']==exp['E_empty']
              assert row['E_cardinality_histogram']==exp['distribution']
              assert row['structural_criterion_agrees_with_brute_force']
          print('PASS: Clifford theorem, nine-element pair and 176 linked systems.')
          PY

      - name: Reproduce study twelve oracle query bounds and adversary blocks
        run: |
          python3 experiments/layered_oracle_decision.py --output /tmp/layered-oracle.json
          cat /tmp/layered-oracle.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/layered-oracle.json').read_text())
          assert sum(x['monoids'] for x in d['labelled_small_monoids'])==170
          assert all(x['all_predictions_match'] for x in d['labelled_small_monoids'])
          assert all(x['all_changed_variants_E_empty'] for x in d['hard_family'])
          assert all(x['base_orbit_queries']>=x['independent_blocks'] for x in d['hard_family'])
          if Path('results/layered_oracle_study12.json').exists():
              assert d==json.loads(Path('results/layered_oracle_study12.json').read_text())
          print('PASS: exact layered decision and quadratic query lower-bound fixtures.')
          PY

      - name: Recompute study thirteen fixed-Green adversary
        run: |
          python3 experiments/green_metadata_adversary.py > /tmp/green-adversary.json
          diff -u results/green_metadata_adversary_study13.json /tmp/green-adversary.json

      - name: Reproduce study fourteen fixed rank lower bound
        run: |
          python3 experiments/fixed_rank_oracle.py > /tmp/fixed-rank.json
          diff -u results/fixed_rank_oracle_study14.json /tmp/fixed-rank.json

  independent-gap:
    name: Independent algebra audit (GAP)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP computer algebra system
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gap-core
      - name: Recount monoids using GAP and verify published algebra tables
        run: gap -q -b < experiments/verify_with_gap.g
      - name: Independently construct ten minimal monoids and distinguish opposites
        run: gap -q -b < experiments/verify_minimal_six_with_gap.g
      - name: Rebuild Rees counterexamples and compare Green invariants using GAP
        run: gap -q -b < experiments/verify_rees_obstruction.g
      - name: Verify Clifford cross-J linking-map counterexample using GAP
        run: gap -q -b < experiments/verify_clifford_linking_maps.g
      - name: Independently verify all sixteen 2x2 fixed-Green adversary matrices
        run: gap -q -b < experiments/verify_green_metadata_adversary.g
