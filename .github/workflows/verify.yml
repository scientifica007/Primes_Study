name: Verify mathematical experiments

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  finite-binary-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reproducibility tests
        run: python3 -m unittest discover -s tests -v
      - name: Recompute finite-system statistics
        run: python3 experiments/finite_binary_systems.py --max-size 4 --output /tmp/finite-recomputed.json
      - name: Check first checked-in result
        run: diff -u results/finite_binary_systems_n1_to_n4.json /tmp/finite-recomputed.json
      - name: Recompute residues mod 2 through 100
        run: python3 experiments/multiplication_mod_n.py --max-modulus 100 --output /tmp/residue-recomputed.json
      - name: Check residue result
        run: diff -u results/residue_multiplication_n2_to_n100.json /tmp/residue-recomputed.json
      - name: Recompute order-1-through-4 monoids and structural witnesses
        run: python3 experiments/finite_monoids.py --max-size 4 --output /tmp/recomputed-monoids.json
      - name: Compare monoid report to committed results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/monoids_n1_to_n4.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/recomputed-monoids.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Recomputed monoid census differs from committed results'
          print('Monoid report matches committed data.')
          PY
      - name: Recompute multi-operation exact counts
        run: python3 experiments/multiple_operations.py --max-size 4 --max-operations 3 --output /tmp/multi-recomputed.json
      - name: Compare multi-operation results to committed data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/multiple_binary_operations_n1_to_n4_m1_to_m3.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/multi-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Multi-operation count table differs from committed results'
          print('Multi-operation theorem counts match checked-in data.')
          PY
      - name: Recompute the dynamic-system and control-guard cases
        run: python3 experiments/dynamic_systems.py --output /tmp/dynamic-recomputed.json
      - name: Compare dynamic-system report with committed data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/dynamic_systems.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/dynamic-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Dynamic-system cases differ from checked-in report'
          print('Dynamic systems and target-dependent guards match checked-in report.')
          PY
      - name: Recompute inhibited-reaction census (152 rules, both semantics)
        run: python3 experiments/inhibited_reactions.py --output /tmp/inhibited-recomputed.json
      - name: Validate study-six reproducibility
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/inhibited_reactions.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/inhibited-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Inhibited reaction census or witness traces differ'
          print('Inhibitor, consumption and 152-rule census match the recorded data.')
          PY
      - name: Recompute study-seven multiset and conservation results
        run: python3 experiments/multiset_production.py --output /tmp/multiset-recomputed.json
      - name: Check study-seven results and witness traces
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('results/multiset_production.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/multiset-recomputed.json').read_text(encoding='utf-8'))
          assert expected == actual, 'Multiset results or witness traces do not match the code'
          print('Multiset coefficient census, type-emergence tests, and conservation traces verified.')
          PY
