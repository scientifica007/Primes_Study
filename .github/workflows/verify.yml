name: Verify mathematical experiments

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  finite-binary-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reproducibility tests
        run: python3 -m unittest discover -s tests -v
      - name: Recompute finite-system statistics
        run: python3 experiments/finite_binary_systems.py --max-size 4 --output /tmp/recomputed.json
      - name: Check checked-in result
        run: diff -u results/finite_binary_systems_n1_to_n4.json /tmp/recomputed.json
