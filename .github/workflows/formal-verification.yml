name: Lean formal verification
on:
  push:
    branches: [research/formal-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Use locked Mathlib dependencies and get cached builds
        run: |
          lean --version
          echo '81a1d1b081d2bf0119c0ec23caed9090145aa2e4a52d33b3c451b970ff66f85d  lake-manifest.json' | sha256sum --check
          lake exe cache get
          git diff --exit-code -- lake-manifest.json
      - name: Check local proof sources for prohibited placeholders
        run: |
          if grep -REn '\b(sorry|admit|sorryAx|axiom|unsafe)\b' --include='*.lean' RelationalPrimality RelationalPrimality.lean; then
            echo "Prohibited token found"
            exit 1
          fi
      - name: Build the formal library
        run: lake build
      - name: Audit foundational theorem axiom dependencies
        run: |
          set -o pipefail
          {
            lake env lean RelationalPrimality/Foundations.lean &&
            lake env lean RelationalPrimality/Monoids.lean &&
            lake env lean RelationalPrimality/Operations.lean &&
            lake env lean RelationalPrimality/Generation.lean &&
            lake env lean RelationalPrimality/Counting.lean &&
            lake env lean RelationalPrimality/IntersectionDepth.lean
          } | tee /tmp/formal-axioms.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          out = Path('/tmp/formal-axioms.txt').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in ['T01', 'T02', 'T06', 'T11', 'T12', 'T13', 'term_is_derived', 'T13_fixed', 'generated_mono', 'generates_mono', 'generates_complement_iff', 'T53_core', 'E_iff_all_generating', 'finite_refinement', 'E_iff_all_irredundant_finite', 'erase_univ_generates_iff', 'T53_count', 'binary_E_iff', 'binary_generated_iff_word', 'generated_substitute', 'generated_finite_support', 'finite_generating_subset', 'fg_refinement', 'E_iff_all_irredundant_fg', 'essentialPart_exact', 'T77_rank_bound']:
              m = re.search(r"'(?:RelationalPrimality\.)?" + name + r"' (does not depend on any axioms|depends on axioms: \[([^\]]*)\])", out)
              assert m, f'Missing axiom audit: {name}: {out}'
              used = {x.strip() for x in (m.group(2) or '').split(',') if x.strip()}
              assert used <= allowed, f'{name}: disallowed axioms {used - allowed}'
              print(name, 'axioms:', sorted(used))
          PY
      - name: Record resolved dependency manifest without artifact storage
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          raw = Path('lake-manifest.json').read_bytes()
          data = json.loads(raw)
          assert data.get('packages'), 'Resolved package list is empty'
          print('LEAN_MANIFEST_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('LEAN_MANIFEST_BEGIN')
          print(raw.decode('utf-8'))
          print('LEAN_MANIFEST_END')
          PY
